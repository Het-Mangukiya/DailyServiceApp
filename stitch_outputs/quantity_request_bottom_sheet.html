<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Clinical Sanctuary - Request Details</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary-fixed": "#00201e",
              "surface-container-low": "#f1f4f4",
              "primary-fixed-dim": "#7ed4db",
              "surface-container-high": "#e5e9e9",
              "on-secondary-container": "#256e73",
              "on-tertiary": "#ffffff",
              "tertiary-fixed-dim": "#a0d0ca",
              "tertiary-fixed": "#bbece6",
              "inverse-surface": "#2d3131",
              "on-primary": "#ffffff",
              "primary": "#00666c",
              "surface-tint": "#00696f",
              "on-surface-variant": "#3e494a",
              "surface-container-highest": "#e0e3e3",
              "surface-dim": "#d7dbdb",
              "outline-variant": "#bdc9c9",
              "on-secondary-fixed-variant": "#004f53",
              "surface-container": "#ebeeee",
              "on-tertiary-container": "#f3fffc",
              "on-background": "#181c1d",
              "on-error": "#ffffff",
              "inverse-on-surface": "#eef1f1",
              "error-container": "#ffdad6",
              "on-surface": "#181c1d",
              "error": "#ba1a1a",
              "secondary-fixed-dim": "#8ed2d7",
              "primary-container": "#1d8187",
              "secondary-fixed": "#a9eef3",
              "background": "#f7fafa",
              "surface-bright": "#f7fafa",
              "on-primary-container": "#f4feff",
              "surface-container-lowest": "#ffffff",
              "outline": "#6e797a",
              "tertiary": "#36645f",
              "tertiary-container": "#4f7d78",
              "surface-variant": "#e0e3e3",
              "on-secondary-fixed": "#002022",
              "surface": "#f7fafa",
              "secondary-container": "#a9eef3",
              "on-secondary": "#ffffff",
              "on-primary-fixed-variant": "#004f54",
              "on-tertiary-fixed-variant": "#1f4e4a",
              "on-error-container": "#93000a",
              "inverse-primary": "#7ed4db",
              "secondary": "#1c686d",
              "primary-fixed": "#9af1f8",
              "on-primary-fixed": "#002022"
            },
            fontFamily: {
              "headline": ["Manrope"],
              "body": ["Manrope"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
        }
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #f7fafa;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Header Suppression: Back action implies a focused journey -->
<header class="bg-[#f7fafa]/80 backdrop-blur-xl fixed top-0 w-full z-50 px-6 py-4 flex items-center shadow-[0_8px_24px_rgba(24,28,29,0.04)]">
<button class="p-2 hover:bg-[#f1f4f4] rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined text-[#00666c]">arrow_back</span>
</button>
<h1 class="ml-4 text-xl font-bold text-[#00666c] tracking-tighter">Clinical Sanctuary</h1>
</header>
<!-- Main Content Underlay (Blurred Dashboard Representation) -->
<main class="flex-1 pt-24 px-6 pb-12">
<div class="max-w-md mx-auto space-y-6 opacity-40 select-none">
<div class="h-48 bg-surface-container-low rounded-xl"></div>
<div class="h-32 bg-surface-container-low rounded-xl"></div>
<div class="h-64 bg-surface-container-low rounded-xl"></div>
</div>
</main>
<!-- Bottom Sheet Backdrop -->
<div class="fixed inset-0 bg-on-background/20 backdrop-blur-sm z-[60]"></div>
<!-- Bottom Sheet Container -->
<div class="fixed bottom-0 left-0 right-0 z-[70] flex justify-center items-end">
<div class="w-full max-w-2xl bg-background rounded-t-[2.5rem] shadow-[0_-12px_40px_rgba(0,0,0,0.08)] overflow-hidden">
<!-- Handle Bar -->
<div class="flex justify-center pt-4 pb-2">
<div class="w-12 h-1.5 bg-outline-variant/30 rounded-full"></div>
</div>
<!-- Content Container -->
<div class="px-8 pb-10 pt-2">
<!-- Title Header -->
<div class="mb-8">
<h2 class="font-headline text-2xl font-extrabold text-on-surface tracking-tight">Request Details</h2>
<p class="font-label text-sm text-on-surface-variant/70 mt-1">Reviewing volume adjustment for Oct 24, 2023 • 09:45 AM</p>
</div>
<!-- Bento Style Soft Cards -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
<!-- Customer Context Card -->
<div class="col-span-1 md:col-span-2 bg-surface-container-low p-6 rounded-xl flex items-center gap-4">
<div class="w-14 h-14 bg-secondary-fixed rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary-fixed text-2xl" data-icon="person">person</span>
</div>
<div>
<span class="font-label text-[11px] uppercase tracking-wider text-on-surface-variant font-semibold">Customer Name</span>
<p class="font-headline text-lg font-bold text-on-surface">Aman Gupta</p>
</div>
</div>
<!-- Comparison Section -->
<div class="bg-surface-container-lowest p-6 rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.02)] border border-outline-variant/10">
<span class="font-label text-[11px] uppercase tracking-wider text-on-surface-variant font-semibold">Current Qty</span>
<div class="mt-2 flex items-baseline gap-2">
<span class="font-headline text-3xl font-extrabold text-on-surface">2L</span>
<span class="font-body text-sm text-on-surface-variant">Daily</span>
</div>
</div>
<div class="bg-secondary-container/30 p-6 rounded-xl shadow-[0_4px_12px_rgba(0,0,0,0.02)] border border-secondary-fixed/20">
<span class="font-label text-[11px] uppercase tracking-wider text-on-secondary-container font-semibold">Requested Qty</span>
<div class="mt-2 flex items-baseline gap-2">
<span class="font-headline text-3xl font-extrabold text-primary">3L</span>
<span class="font-body text-sm text-on-secondary-container">Daily</span>
</div>
<div class="mt-1 flex items-center gap-1 text-primary text-xs font-bold">
<span class="material-symbols-outlined text-sm" data-icon="trending_up">trending_up</span>
<span>+50% Increase</span>
</div>
</div>
<!-- Reason Card -->
<div class="col-span-1 md:col-span-2 bg-tertiary-fixed/10 p-6 rounded-xl border border-tertiary-fixed/20">
<div class="flex items-start gap-3">
<span class="material-symbols-outlined text-tertiary mt-0.5" data-icon="chat_bubble">chat_bubble</span>
<div>
<span class="font-label text-[11px] uppercase tracking-wider text-on-surface-variant font-semibold">Reason for Request</span>
<p class="font-body text-base text-on-surface-variant mt-2 leading-relaxed">
                                    Increased consumption due to visiting family members.
                                </p>
</div>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col sm:flex-row gap-4 pt-4">
<button class="flex-1 py-4 bg-error-container text-on-error-container rounded-full font-headline font-bold text-base hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="close">close</span>
                        Reject Request
                    </button>
<button class="flex-1 py-4 bg-gradient-to-r from-primary to-primary-container text-on-primary rounded-full font-headline font-bold text-base shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="check">check</span>
                        Approve Change
                    </button>
</div>
</div>
</div>
</div>
</body></html>
