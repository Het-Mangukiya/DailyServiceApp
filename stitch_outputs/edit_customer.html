<input class="w-full bg-surface-container-low border-none rounded-xl py-3.5 px-4 text-on-surface focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 transition-all font-medium" placeholder="Enter name" type="text" value="Elena Rodriguez"/>
</div>
<!-- Phone Number -->
<div class="relative">
<label class="block font-label text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2 ml-1">Phone Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-lg" data-icon="call">call</span>
<input class="w-full bg-surface-container-low border-none rounded-xl py-3.5 pl-12 pr-4 text-on-surface focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 transition-all font-medium" placeholder="Phone" type="tel" value="+1 (555) 234-5678"/>
</div>
</div>
<!-- Address -->

<label class="block font-label text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2 ml-1">Address</label>
<textarea class="w-full bg-surface-container-low border-none rounded-xl py-3.5 px-4 text-on-surface focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 transition-all font-medium resize-none" rows="3">1284 Oakwood Avenue, Suite 4B
Seattle, WA 98101</textarea>
</div>
</div>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Service Type -->
<div class="relative">
<label class="block font-label text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2 ml-1">Service Type</label>
<div class="relative">
<select class="w-full bg-surface-container-low border-none rounded-xl py-3.5 pl-4 pr-10 text-on-surface focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/20 transition-all font-medium appearance-none">

<option>Specialized Therapy</option>
<option>Remote Assessment</option>
</select>

</div>
</div>

</div>
</div>

<span class="material-symbols-outlined text-lg" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                            Active

<span class="material-symbols-outlined text-lg" data-icon="beach_access">beach_access</span>
