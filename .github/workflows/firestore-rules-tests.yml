name: Firestore Rules Tests

on:
  pull_request:
    paths:
      - firestore.rules
      - firestore.indexes.json
      - tests/security/**
      - .github/workflows/firestore-rules-tests.yml
  workflow_dispatch:

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install security test dependencies
        run: npm --prefix tests/security install

      - name: Run Firestore rules tests in emulator
        run: npx --prefix tests/security firebase emulators:exec --only firestore "npm --prefix tests/security run test:rules"
